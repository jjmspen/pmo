<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PMO — Member dashboard</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0D0C}
a{color:#5BE49B;text-decoration:none}a:hover{color:#8EF0BB}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;letter-spacing:-0.02em}
p{margin:0}
</style>
<style>html{scroll-behavior:smooth}</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template"><div style="background: #0A0D0C; color: #E9EEEC; font-family: Inter, sans-serif; min-height: 100vh">

<header style="border-bottom: 1px solid #1C2321">
<nav style="max-width: 1200px; margin: 0 auto; padding: 18px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="index.html" aria-label="PMO home" style="display: flex">
<svg width="80" height="33" viewBox="0 0 264 110" role="img" aria-label="PMO logo"><polygon points="12,12 72,12 72,55 12,55" fill="#E8B931" fill-opacity="0.16"/><polygon points="196,12 234,12 252,55 234,98 196,98 178,55" fill="#4C8DFF" fill-opacity="0.16"/><g fill="none" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><polyline points="12,98 12,12 72,12 72,55 12,55" stroke="#E8B931"/><line x1="88" y1="98" x2="101" y2="12" stroke="#26A69A"/><line x1="101" y1="12" x2="124" y2="62" stroke="#26A69A"/><line x1="124" y1="62" x2="147" y2="12" stroke="#EF5350"/><line x1="147" y1="12" x2="160" y2="98" stroke="#EF5350"/><polygon points="196,12 234,12 252,55 234,98 196,98 178,55" stroke="#4C8DFF"/></g></svg>
</a>
<div style="display: flex; align-items: center; gap: 20px; font-size: 15px">
<a href="index.html" style="color: #B4BEBA">Site</a>
<a href="account.html" style="color: #B4BEBA">Log out</a>
<div style="width: 36px; height: 36px; border-radius: 50%; background: #1C2321; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #C9D1CE">TJ</div>
</div>
</nav>
</header>

<main style="max-width: 1200px; margin: 0 auto; padding: 48px 32px 96px; display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #7D8984">MEMBER DASHBOARD</span><h1 style="font-size: 38px; font-weight: 600">Welcome back, trader_jane</h1></div>
<a href="access.html" style="border: 1px solid #2A3330; color: #E9EEEC; padding: 12px 20px; border-radius: 8px; font-weight: 500">Upgrade or renew</a>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px">
<div style="background: #0F1413; border: 1px solid #1C2321; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 10px">
<span style="color: #7D8984; font-size: 13px">Plan</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 600">Pro · Monthly</span>
<span style="color: #A3AEA9; font-size: 14px">Access until [date]</span>
</div>
<div style="background: #0F1413; border: 1px solid #1C2321; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 10px">
<span style="color: #7D8984; font-size: 13px">TradingView username</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 500">trader_jane</span>
<a href="#" style="font-size: 14px">Change username</a>
</div>
<div style="background: #0F1413; border: 1px solid #1C2321; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 10px">
<span style="color: #7D8984; font-size: 13px">Indicator access</span>
<span style="display: flex; align-items: center; gap: 10px; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 600"><span style="width: 10px; height: 10px; border-radius: 2px; background: #26A69A"></span>Active</span>
<span style="color: #A3AEA9; font-size: 14px">Granted [date] on TradingView</span>
</div>
</div>

<section style="background: #0F1413; border: 1px solid #1C2321; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 24px">
<h2 style="font-size: 20px; font-weight: 600">Access progress</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 8px; padding-top: 14px; border-top: 3px solid #26A69A"><span style="font-weight: 600; font-size: 15px">Account created</span><span style="color: #7D8984; font-size: 13px">[date]</span></div>
<div style="display: flex; flex-direction: column; gap: 8px; padding-top: 14px; border-top: 3px solid #26A69A"><span style="font-weight: 600; font-size: 15px">Payment confirmed</span><span style="color: #7D8984; font-size: 13px">USDT · TRC20 · [date]</span></div>
<div style="display: flex; flex-direction: column; gap: 8px; padding-top: 14px; border-top: 3px solid #26A69A"><span style="font-weight: 600; font-size: 15px">Access granted</span><span style="color: #7D8984; font-size: 13px">Added to Pro scripts</span></div>
<div style="display: flex; flex-direction: column; gap: 8px; padding-top: 14px; border-top: 3px solid #2A3330"><span style="font-weight: 600; font-size: 15px; color: #A3AEA9">Renewal due</span><span style="color: #7D8984; font-size: 13px">[date]</span></div>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px"><h2 style="font-size: 20px; font-weight: 600">Your indicators</h2><span style="color: #7D8984; font-size: 14px">On TradingView: Indicators → Invite-only scripts</span></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px">
<div style="border: 1px solid #1C2321; border-radius: 14px; padding: 22px; display: flex; justify-content: space-between; align-items: center; gap: 12px"><div style="display: flex; flex-direction: column; gap: 4px"><span style="font-weight: 600">PMO WaveTrend</span><span style="color: #7D8984; font-size: 13px">Core</span></div><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #26A69A; border: 1px solid #1F4A44; padding: 5px 10px; border-radius: 6px">ACTIVE</span></div>
<div style="border: 1px solid #1C2321; border-radius: 14px; padding: 22px; display: flex; justify-content: space-between; align-items: center; gap: 12px"><div style="display: flex; flex-direction: column; gap: 4px"><span style="font-weight: 600">PMO Ribbon</span><span style="color: #7D8984; font-size: 13px">Pro</span></div><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #26A69A; border: 1px solid #1F4A44; padding: 5px 10px; border-radius: 6px">ACTIVE</span></div>
<div style="border: 1px solid #1C2321; border-radius: 14px; padding: 22px; display: flex; justify-content: space-between; align-items: center; gap: 12px"><div style="display: flex; flex-direction: column; gap: 4px"><span style="font-weight: 600">[Third indicator]</span><span style="color: #7D8984; font-size: 13px">Pro</span></div><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #E8B931; border: 1px solid #4A3F1C; padding: 5px 10px; border-radius: 6px">PENDING</span></div>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 16px">
<h2 style="font-size: 20px; font-weight: 600">Payments</h2>
<div style="border: 1px solid #1C2321; border-radius: 14px; overflow-x: auto">
<table style="width: 100%; border-collapse: collapse; font-size: 14px; min-width: 640px">
<thead><tr style="text-align: left; color: #7D8984"><th style="padding: 14px 20px; font-weight: 500">Date</th><th style="padding: 14px 20px; font-weight: 500">Plan</th><th style="padding: 14px 20px; font-weight: 500">Amount</th><th style="padding: 14px 20px; font-weight: 500">Transaction</th><th style="padding: 14px 20px; font-weight: 500">Status</th></tr></thead>
<tbody>
<tr style="border-top: 1px solid #1C2321"><td style="padding: 14px 20px">[date]</td><td style="padding: 14px 20px">Pro · Monthly</td><td style="padding: 14px 20px">[AMOUNT] USDT</td><td style="padding: 14px 20px; font-family: 'JetBrains Mono', monospace; color: #A3AEA9">[tx hash]</td><td style="padding: 14px 20px; color: #26A69A">Confirmed</td></tr>
<tr style="border-top: 1px solid #1C2321"><td style="padding: 14px 20px">[date]</td><td style="padding: 14px 20px">Pro · Monthly</td><td style="padding: 14px 20px">[AMOUNT] USDT</td><td style="padding: 14px 20px; font-family: 'JetBrains Mono', monospace; color: #A3AEA9">[tx hash]</td><td style="padding: 14px 20px; color: #26A69A">Confirmed</td></tr>
</tbody>
</table>
</div>
</section>
</main>
</div></template>
<script src="dc-runtime.js"></script>
<script>
class Component extends DCLogic {
  renderVals() { return {}; }
}
mountDC(Component);
</script>
</body>
</html>
