><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><line x1="6" y1="2" x2="6" y2="22" stroke="#C9D1CE" stroke-width="1.4"/><rect x="2.5" y="6" width="7" height="11" rx="1" fill="none" stroke="#C9D1CE" stroke-width="1.4"/><line x1="18" y1="2" x2="18" y2="22" stroke="#56615D" stroke-width="1.4"/><rect x="14.5" y="7" width="7" height="11" rx="1" fill="#56615D"/></svg></span><span style="display: flex; flex-direction: column; gap: 2px; text-align: left"><span style="font-weight: 600; font-size: 14px; color: #E9EEEC">Monochrome / high contrast</span><span style="font-size: 12px; color: #7D8984; line-height: 1.4">Achromatopsia, low vision</span></span><span style="margin-left: auto; color: #E8B931; font-size: 14px">{{tk_mono}}</span></button><button type="button" role="menuitemcheckbox" aria-checked="{{markers}}" onClick="{{toggleMarkers}}" style="display: flex; align-items: center; gap: 12px; padding: 12px; margin-top: 4px; border: 0; border-top: 1px solid #1C2321; background: transparent; font: inherit; cursor: pointer; width: 100%"><span style="flex: none; width: 28px; text-align: center; font-size: 12px; color: #E9EEEC">▲▼</span><span style="display: flex; flex-direction: column; gap: 2px; text-align: left"><span style="font-weight: 600; font-size: 14px; color: #E9EEEC">Signal markers</span><span style="font-size: 12px; color: #7D8984">Shapes on buy and sell candles</span></span><span style="margin-left: auto; flex: none; width: 34px; height: 20px; border-radius: 999px; background: {{swBg}}; position: relative"><span style="position: absolute; top: 2px; left: {{swX}}px; width: 16px; height: 16px; border-radius: 50%; background: {{swKnob}}"></span></span></button></div></div></div></sc-if></div></template>
<script src="dc-runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { vision: 'std', open: false, markers: false }; }
  renderVals() {
    const v = this.state.vision, open = this.state.open, mk = this.state.markers;
    const item = (on) => 'display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border-radius: 8px; border: 0; font: inherit; cursor: pointer; background: ' + (on ? 'rgba(232,185,49,0.08)' : 'transparent');
    const pick = (k) => () => this.setState({ vision: k, open: false, markers: k !== 'std' });
    const vals = {
      isStd: v === 'std', isRg: v === 'rg', isTrit: v === 'trit', isMono: v === 'mono',
      visionOpen: open, caret: open ? '▴' : '▾', markers: mk, noMarkers: !mk,
      vbtnStyle: 'display: inline-flex; align-items: center; gap: 7px; font: inherit; font-size: 13px; border-radius: 8px; padding: 8px 11px; cursor: pointer; ' + (open ? 'color: #E9EEEC; border: 1px solid #E8B931; background: #0E1312' : 'color: #A3AEA9; border: 1px solid #2A3330; background: transparent'),
      toggleVision: () => this.setState({ open: !open }), closeVision: () => this.setState({ open: false }),
      toggleMarkers: () => this.setState({ markers: !mk }),
      swBg: mk ? '#E8B931' : '#3A4441', swX: mk ? 16 : 2, swKnob: mk ? '#0A0D0C' : '#C9D1CE'
    };
    for (const k of ['std', 'rg', 'trit', 'mono']) { vals['pick_' + k] = pick(k); vals['st_' + k] = item(v === k); vals['tk_' + k] = v === k ? '✓' : ''; }
    return vals;
  }
}
mountDC(Component);
</script>
